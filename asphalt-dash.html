  // ====== TEROWONGAN ANTAR PETA ======
  function maybeSpawnTunnel() {   // jarang muncul; menunggu bila ada kejadian jalan atau lawan di jalur tepi
    if (ev || dist < nextTunnelAt) return;
    const side = Math.random() < 0.5 ? -1 : 1, lane = side < 0 ? 0 : 2;
    if (enemies.some(e => e.lane === lane && e.y < 320)) return;
    const ids = Object.keys(BIOMES).filter(k => k !== settings.biome);
    const dest = ids[Math.floor(Math.random() * ids.length)];
    pickups.push({ type: 'tunnel', dest, off: (lane - 1) * LANE_W + side * 14, x: 0, y: -90 - LEAD(), w: 72, h: 60, seed: Math.random() * 10 });
    nextTunnelAt = dist + 9000 + Math.random() * 5000;
  }
  const TUNNEL_SECONDS = 3;   // lama di dalam terowongan
  function enterTunnel(p) {
    sfx.nitro();
    warp = { phase: 'in', t: 0, fade: 0, white: 0, fading: false, dest: p.dest, p };   // 'in' = mobil masuk, 'inside' = di dalam (1 jalur), 'out' = keluar di peta baru
    player.lane = p.off < 0 ? 0 : 2;
  }
  function updateWarp(dt) {
    const w = warp; w.t += dt;
    if (w.phase === 'in') {
      if (w.p.y + w.p.h / 2 >= PLAYER_Y + CAR_H / 2) w.fading = true;
      if (w.fading) w.fade = Math.min(1, w.fade + dt / 18);
      if (w.fade >= 1) {   // layar hitam: pindah ke bagian dalam terowongan dan ganti peta
        w.phase = 'inside'; w.t = 0; settings.biome = w.dest; w.p.taken = true;
        enemies = []; pickups = []; parts = [];
        wCur = 'clear'; wPrev = 'clear'; wFade = 1; nextWeatherAt = dist + 2500 + Math.random() * 2000;
        sfx.item();
      }
    } else if (w.phase === 'inside') {
      w.fade = Math.max(0, w.fade - dt / 14);
      if (w.t >= TUNNEL_SECONDS * 60) {   // keluar: kembali ke jalan normal 3 jalur di peta baru
        w.phase = 'out'; w.t = 0; w.white = 1; player.lane = 1; player.off = 0;
        spawnTimer = 90; coinTimer = 150; itemTimer = 500; sfx.nitro();
      }
    } else {
      w.white = Math.max(0, w.white - dt / 28);
      if (w.white <= 0) {
        warp = null; player.invuln = Math.max(player.invuln, 40);
        nextEventAt = dist + 3000 + Math.random() * 3000; nextTunnelAt = dist + 9000 + Math.random() * 5000;
      }
    }
  }
  function drawTunnelInside() {   // terowongan kecil: hanya 1 jalur
    const cx = W / 2, hw = 44, t = warp.t;
    ctx.fillStyle = '#1b2230'; ctx.fillRect(0, 0, W, H);
    // dinding batu bergerak
    ctx.fillStyle = '#2a3446';
    const off = dist % 30;
    for (const side of [-1, 1]) {
      const x0 = side < 0 ? 0 : cx + hw + 10, wd = side < 0 ? cx - hw - 10 : W - (cx + hw + 10);
      for (let y = -30 + off, r = 0; y < H; y += 30, r++) {
        ctx.fillRect(x0, y, wd, 2);
        for (let x = x0 + ((Math.floor((y - off) / 30) & 1) ? 0 : 18); x < x0 + wd; x += 36) ctx.fillRect(x, y, 2, 30);
      }
    }
    ctx.fillStyle = '#4b5563'; ctx.fillRect(cx - hw - 10, 0, 10, H); ctx.fillRect(cx + hw, 0, 10, H);   // tepi jalan
    ctx.fillStyle = '#2b3038'; ctx.fillRect(cx - hw, 0, hw * 2, H);                                       // jalan 1 jalur
    ctx.fillStyle = '#fde68a'; for (let y = -60 + (dist % 60); y < H; y += 60) ctx.fillRect(cx - 3, y, 6, 30);
    // lampu langit-langit
    const step = 170, z0 = Math.floor(dist / step) * step;
    for (let i = 0; i < 6; i++) {
      const y = H - (z0 + i * step - dist); if (y < -60 || y > H + 60) continue;
      const g = ctx.createRadialGradient(cx, y, 0, cx, y, 110);
      g.addColorStop(0, 'rgba(253,224,71,.38)'); g.addColorStop(1, 'rgba(253,224,71,0)');
      ctx.fillStyle = g; ctx.fillRect(0, y - 110, W, 220);
      ctx.fillStyle = '#fde047'; ctx.fillRect(cx - hw - 8, y - 4, 8, 8); ctx.fillRect(cx + hw, y - 4, 8, 8);
    }
    // gelap di kejauhan
    const dg = ctx.createLinearGradient(0, 0, 0, H * 0.7); dg.addColorStop(0, 'rgba(0,0,0,.85)'); dg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
    // cahaya di ujung terowongan (menjelang keluar)

      const lg = ctx.createRadialGradient(cx, -10, 0, cx, -10, 70 + 420 * k);
      lg.addColorStop(0, `rgba(255,255,255,${0.35 + 0.65 * k})`); lg.addColorStop(1, 'rgba(255,255,255,0)');

    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(cx - 20, PLAYER_Y + 6); ctx.lineTo(cx + 20, PLAYER_Y + 6); ctx.lineTo(cx + 44, PLAYER_Y - 260); ctx.lineTo(cx - 44, PLAYER_Y - 260); ctx.closePath(); ctx.fill();
    const px = player.x, to = tiltOverride;

  }
  function drawWarpFade() {

  function drawPortal(p, cx, cy) {   // terowongan kecil di tepi jalan + papan gambar peta tujuan

    ctx.fillStyle = '#92400e'; ctx.fillRect(cx - 2, cy - 44, 4, 16);                           // tiang papan
    ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2.5; rr(ctx, cx - 19, cy - 70, 38, 30, 6); ctx.fill(); ctx.stroke();

  function drawWarpTitle() {   // info peta tujuan saat berada di dalam terowongan
    if (!warp || warp.phase !== 'inside') return;
    const a = Math.max(0, Math.min(1, (warp.t - 12) / 15, (TUNNEL_SECONDS * 60 - 55 - warp.t) / 15));
    if (a <= 0) return;

    const name = B.n[settings.lang].toUpperCase(); ctx.strokeText(name, W / 2, H * 0.3 + 52); ctx.fillText(name, W / 2, H * 0.3 + 52);
    ctx.restore();
  }

  // ====== MODE FIRST PERSON (pseudo-3D, pandangan dari dalam mobil) ======
  // Dunia game sama persis (jalur, lawan, item, kejadian, tabrakan); yang diganti hanya cara menggambarnya:
  // jalan berperspektif, benda 3D, dan kabin mobil. Tampak atas tetap ada sebagai mode biasa.
  const FPC = { HOR: 215, CAMH: 58, F: 215, BACK: 44, LEAD: 280 };
  const cam = { u: 0, c0: 0, slope: 0, zc: 0, camY: 0, F: FPC.F, hor: FPC.HOR, bgX: 0, fogc: [214, 222, 230], n: 0, r: 0, f: 0 };
  let fpNit = 0, fpCrash = null, fpZone = null, fpGlow = [], fpSteer = 0, fpRoll = 0, fpBob = 0;
  const isFP = () => settings.view === 'fp';
  const LEAD = () => (settings.view === 'fp' ? FPC.LEAD : 0);   // lawan/item muncul lebih jauh di depan supaya terlihat dari kejauhan
  const fclamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const hexRGB = h => { h = h.replace('#', ''); if (h.length === 3) h = h.replace(/./g, c => c + c); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mixC = (a, b, t) => { const A = typeof a === 'string' ? hexRGB(a) : a, C = typeof b === 'string' ? hexRGB(b) : b; return [A[0] + (C[0] - A[0]) * t, A[1] + (C[1] - A[1]) * t, A[2] + (C[2] - A[2]) * t]; };
  const rgbS = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a === undefined ? 1 : a})`;
  const shade = (hex, f) => { const c = hexRGB(hex); return `rgb(${Math.min(255, c[0] * f) | 0},${Math.min(255, c[1] * f) | 0},${Math.min(255, c[2] * f) | 0})`; };
  const wtint = hex => rgbS(mixC(mixC(mixC(hex, [100, 110, 124], 0.3 * cam.r), cam.fogc, 0.75 * cam.f), [8, 12, 30], 0.7 * cam.n));

  function fpCamSet() {
    const camY = PLAYER_Y + FPC.BACK;
    cam.camY = camY; cam.u = player ? player.off : 0;
    cam.c0 = roadCenter(camY);
    cam.slope = (roadCenter(camY - 12) - roadCenter(camY + 12)) / 24;   // arah jalan di depan mobil
    cam.zc = dist + H - camY;
    cam.F = FPC.F * (1 + 0.1 * fpNit);
    cam.hor = FPC.HOR + fpBob;
    cam.n = wAlpha('night'); cam.r = wAlpha('rain'); cam.f = wAlpha('fog');
    cam.fogc = biome().fogRGB.split(',').map(Number);
  }
  // geseran samping jalan di kedalaman dz, relatif terhadap arah mobil (kamera ikut menghadap arah jalan)
  const fpCC = dz => (roadCenter(cam.camY - dz) - cam.c0 - cam.slope * dz) * 0.6;   // kelokan dilunakkan supaya pandangan di depan lebih tenang
  const fpPX = (u, dz, cc) => W / 2 + (u - cam.u + cc) * cam.F / dz;
  const fpPY = (h, dz) => cam.hor + (FPC.CAMH - h) * cam.F / dz;
  const fogA = dz => (dz > 700 ? Math.max(0, 1 - (dz - 700) / 260) : 1);

  function quad(c, ax, ay, bx, by, cx, cy, dx, dy) {
    ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.lineTo(dx, dy); ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // ---------- langit, awan, bukit ----------
  function fpSky(B) {
    const hor = cam.hor, n = cam.n, r = cam.r, f = cam.f, fogc = cam.fogc;
    let t = hexRGB({ meadow: '#4f9be0', city: '#6a8fb8', beach: '#35a8e8', desert: '#5aa6dc', snow: '#8fb0d4' }[B.kind]);
    let b = hexRGB({ meadow: '#cfe8ff', city: '#d8e4ef', beach: '#d9f1ff', desert: '#f6d9a0', snow: '#eef3f9' }[B.kind]);
    t = mixC(t, [86, 98, 114], 0.6 * r); b = mixC(b, [150, 160, 172], 0.55 * r);
    t = mixC(t, fogc, 0.6 * f); b = mixC(b, fogc, 0.9 * f);
    t = mixC(t, [8, 16, 46], 0.9 * n); b = mixC(b, [38, 54, 104], 0.85 * n);
    cam.skyBot = b;
    const g = ctx.createLinearGradient(0, 0, 0, hor); g.addColorStop(0, rgbS(t)); g.addColorStop(1, rgbS(b));
    ctx.fillStyle = g; ctx.fillRect(-80, -80, W + 160, hor + 82);
    const bgX = 0; cam.bgX = 0;   // latar (bukit, matahari, awan) diam: tidak ikut bergoyang saat jalan berbelok
    if (n > 0.2) {   // bintang
      ctx.fillStyle = `rgba(255,255,255,${0.9 * n})`;
      for (let i = 0; i < 46; i++) { const m = W + 200, x = ((hrand(i, 3, 5) * m + bgX * 0.25) % m + m) % m - 100; ctx.fillRect(x, hrand(i, 4, 5) * (hor - 30), 1.6, 1.6); }
    }
    const sunA = (1 - n) * (1 - r) * (1 - f);
    if (sunA > 0.02) {
      const sx = W * 0.72 + bgX * 0.2, sy = hor * 0.36, sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 95);
      sg.addColorStop(0, `rgba(255,246,200,${0.7 * sunA})`); sg.addColorStop(1, 'rgba(255,246,200,0)');
      ctx.fillStyle = sg; ctx.fillRect(sx - 100, sy - 100, 200, 200);
      ctx.fillStyle = `rgba(255,250,222,${sunA})`; ctx.beginPath(); ctx.arc(sx, sy, 20, 0, 7); ctx.fill();
    }
    if (n > 0.3) {   // bulan
      const mx = W * 0.28 + bgX * 0.2, my = hor * 0.3;
      ctx.fillStyle = `rgba(241,245,255,${n})`; ctx.beginPath(); ctx.arc(mx, my, 16, 0, 7); ctx.fill();
      ctx.fillStyle = rgbS(t, n); ctx.beginPath(); ctx.arc(mx + 7, my - 3, 14, 0, 7); ctx.fill();
    }
    const cc = mixC([255, 255, 255], [118, 126, 140], Math.max(r * 0.8, n * 0.85));
    ctx.fillStyle = rgbS(cc, 0.85 * (1 - 0.5 * f));
    for (let i = 0; i < 6; i++) {
      const m = W + 260, x = ((i * 173 + tick * (0.012 + (i % 3) * 0.004) + bgX * 0.35) % m + m) % m - 130, y = 26 + (i * 37) % (hor * 0.5);
      ctx.beginPath(); ctx.ellipse(x, y, 34, 10, 0, 0, 7); ctx.ellipse(x - 22, y + 4, 20, 8, 0, 0, 7); ctx.ellipse(x + 24, y + 3, 22, 8, 0, 0, 7); ctx.fill();
    }
    // bukit / gedung jauh di cakrawala
    const lay = (base, a1, f1, a2, f2, sh, col) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-90, hor + 3);
      for (let x = -90; x <= W + 90; x += 8) ctx.lineTo(x, hor - (base + a1 * Math.sin((x + sh) / f1) + a2 * Math.sin((x + sh) / f2 + 1.7)));
      ctx.lineTo(W + 90, hor + 3); ctx.closePath(); ctx.fill();
    };
    if (B.kind === 'meadow') { lay(30, 12, 90, 6, 31, bgX * 0.6, wtint('#6a9a74')); lay(16, 8, 60, 4, 23, bgX, wtint('#2f7a3b')); }
    else if (B.kind === 'city') {
      for (let layer = 0; layer < 2; layer++) {
        const sh = bgX * (0.6 + layer * 0.4); ctx.fillStyle = wtint(layer ? '#6d7b90' : '#8896aa');
        for (let i = Math.floor((-sh - 60) / 26); i <= Math.ceil((W - sh + 60) / 26); i++) {

        }
      }
    } else if (B.kind === 'beach') {
      ctx.fillStyle = wtint('#3aa8e2'); ctx.fillRect(-90, hor - 7, W + 180, 10);
      ctx.save(); ctx.beginPath(); ctx.rect(W * 0.5, 0, W, hor + 4); ctx.clip(); lay(8, 4, 70, 2, 25, bgX, wtint('#e6c98a')); ctx.restore();
    } else if (B.kind === 'desert') {

    quad(cF, xN0, yN0, xN1, yN0, xN1, yN1, xN0, yN1);
    const P = {
      kN, dN, dF, ccN, ccF, side, xN0, xN1, yN0, yN1,

      fr(a, b, c, d, col) { ctx.fillStyle = col; ctx.fillRect(this.fx(a), this.fy(d), (b - a) * kN, (d - c) * kN); },
      pt(u, h, d) { const t = (d - dN) / (dF - dN), cc = ccN + (ccF - ccN) * t, k = cam.F / d; return [W / 2 + (u - cam.u + cc) * k, hor + (ch - h) * k]; },
