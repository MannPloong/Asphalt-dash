  #game.lobby #lobby { display: block; }
  #gear, #shopBtn { display: none !important; }   /* gameplay bersih: tanpa tombol pengaturan dan toko */
  #game.lobby #controls, #game.lobby #btnN { display: none; }
  .lbBtn, .ybtn { pointer-events: auto; border: 0; cursor: pointer; position: relative; overflow: hidden; display: flex; align-items: center;
    font-family: var(--ui); font-style: italic; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: transform .12s, filter .12s; }
  .lbBtn:active, .ybtn:active { filter: brightness(.88); transform: scale(.97); }
  .lbBtn::after, .ybtn::after { content: ''; position: absolute; top: 0; bottom: 0; left: -45%; width: 28%; transform: skewX(-20deg);
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent); animation: lbShine 3.6s ease-in-out infinite; pointer-events: none; }
  #lbShop::after { animation-delay: .5s; } .ybtn::after { animation-delay: 1.1s; }
  @keyframes lbShine { 0%, 60% { left: -45%; } 100% { left: 150%; } }
  .lbBtn .ic, .ybtn .ic { font-style: normal; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  .lbBtn { position: absolute; left: 0; color: #fff; gap: 10px; padding: 0 40px 0 16px; text-align: left;
    -webkit-text-stroke: .5px rgba(4,10,70,.85); text-shadow: 0 2px 0 #0a1a8a, 0 0 14px rgba(140,170,255,.7);
    background: linear-gradient(180deg, rgba(255,255,255,.5) 0, rgba(255,255,255,0) 48%),
                repeating-linear-gradient(115deg, rgba(255,255,255,.09) 0 10px, transparent 10px 20px), linear-gradient(180deg, #5b86ff, #1d38e0);
    box-shadow: inset 0 -6px 0 rgba(8,18,110,.55), inset 0 2px 0 rgba(255,255,255,.7), inset -5px 0 0 rgba(255,255,255,.25);
    -webkit-clip-path: polygon(0 0, 90% 0, 100% 100%, 0 100%); clip-path: polygon(0 0, 90% 0, 100% 100%, 0 100%);
    animation: lbInL .5s cubic-bezier(.2,1.2,.4,1) both; }
  #lbShop { top: 84px; height: 44px; width: 128px; font-size: 18px; padding-right: 34px; }
  #lbView { bottom: 122px; height: 54px; width: 206px; font-size: 17px; padding-right: 46px; animation-delay: .16s; }
  #lbView .tx { display: flex; flex-direction: column; line-height: 1.08; white-space: nowrap; }
  #lbView small { font-size: .56em; letter-spacing: 2px; opacity: .85; }
  #lbView b { font-weight: 700; }
  #lbSettings { top: 134px; height: 58px; width: 236px; font-size: 21px; padding-right: 50px; animation-delay: .08s; }
  .ybtn { color: #2b1500; justify-content: flex-end; gap: 10px; text-shadow: 0 2px 0 rgba(255,255,255,.6);
    background: linear-gradient(180deg, rgba(255,255,255,.6) 0, rgba(255,255,255,0) 50%),
                repeating-linear-gradient(115deg, rgba(255,255,255,.14) 0 12px, transparent 12px 24px), linear-gradient(180deg, #ffd43b, #ff9500);
    box-shadow: inset 0 -7px 0 rgba(160,70,0,.55), inset 0 3px 0 rgba(255,255,255,.75), inset 5px 0 0 rgba(255,255,255,.25);
    -webkit-clip-path: polygon(24% 0, 100% 0, 100% 100%, 0 100%); clip-path: polygon(24% 0, 100% 0, 100% 100%, 0 100%);
    animation: lbInR .5s cubic-bezier(.2,1.2,.4,1) both; }
  #lbPlay { position: absolute; right: 0; bottom: 0; width: 70%; height: 104px; font-size: 50px; padding: 8px 22px 0 0;
    -webkit-clip-path: polygon(45% 0, 100% 0, 100% 100%, 0 100%); clip-path: polygon(45% 0, 100% 0, 100% 100%, 0 100%); animation: lbInR .5s cubic-bezier(.2,1.2,.4,1) .15s both, lbPulse 2s ease-in-out .7s infinite; }
  #lbPlay .ic { font-size: .7em; }
  @keyframes lbInL { from { transform: translateX(-110%); } to { transform: none; } }
  @keyframes lbInR { from { transform: translateX(110%); } to { transform: none; } }
  @keyframes lbPulse { 50% { filter: brightness(1.13); } }
  #lbInfo { position: absolute; top: 12px; left: 0; display: flex; flex-direction: column; gap: 2px; padding: 7px 32px 7px 12px; pointer-events: none;
    background: linear-gradient(135deg, rgba(8,12,30,.85), rgba(30,41,59,.7)); color: #fff; font: italic 700 .85rem var(--ui); letter-spacing: .5px;
    border-left: 4px solid #fbbf24; -webkit-clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); }
  #lbCoins { color: #fde047; }

  /* Layar "ketuk untuk mulai": browser baru mengizinkan musik setelah satu sentuhan, jadi sentuhan itu dibuat jadi bagian dari alur */
  #tapStart { position: absolute; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 45%, rgba(0,0,0,.35), rgba(0,0,0,.72)); cursor: pointer; text-align: center; font-family: var(--ui); font-style: italic; }
  #tapStart.show { display: flex; animation: tsIn .35s ease-out both; }
  #tapStart.hide { animation: tsOut .35s ease-in both; pointer-events: none; }
  .tsTitle { font-size: 2.6rem; font-weight: 700; color: #facc15; text-shadow: 4px 4px 0 #b91c1c, 0 0 24px rgba(250,204,21,.45); line-height: 1.05; }
  .tsHint { font-size: 1.05rem; font-weight: 700; color: #fff; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(0,0,0,.6); animation: blink 1.1s steps(2) infinite; }
  @keyframes tsIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tsOut { from { opacity: 1; } to { opacity: 0; } }

  /* Pilihan setelah kalah (kanan bawah, bertumpuk) */
  #overBtns { position: absolute; right: 0; bottom: 0; z-index: 4; display: none; flex-direction: column; align-items: flex-end; gap: 6px; }
  #game.over #overBtns { display: flex; }
  #overBtns .ybtn { height: 62px; font-size: 25px; padding: 4px 20px 0 0; width: 250px; white-space: nowrap; animation-delay: .1s; }
  #ovLobby { width: 200px !important; height: 54px !important; font-size: 21px !important; animation-delay: .22s !important; }
  #game.over #btnN, #game.over #controls { display: none; }

  /* Tombol dibulatkan di tiap sisi (tidak lagi miring/tajam) */
  .lbBtn, .ybtn { -webkit-clip-path: none !important; clip-path: none !important; border-radius: 20px !important;
    box-shadow: inset 0 -5px 0 rgba(8,18,110,.5), inset 0 2px 0 rgba(255,255,255,.65), 0 5px 12px rgba(0,0,0,.4) !important; }
  .ybtn { box-shadow: inset 0 -6px 0 rgba(160,70,0,.5), inset 0 3px 0 rgba(255,255,255,.7), 0 5px 12px rgba(0,0,0,.4) !important; }
  .lbBtn { left: 12px; padding: 0 18px 0 14px !important; }
  #lbShop { top: 84px; width: 124px; }
  #lbSettings { top: 134px; width: 216px; }
  #lbView { width: 190px; bottom: 126px; }
  #lbPlay { right: 12px; bottom: 12px; width: 62%; height: 96px; padding: 4px 22px 0 22px !important; justify-content: center; }
  #lbLogo { position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; line-height: .92; pointer-events: none;
    font-family: var(--ui); font-style: italic; font-weight: 700; color: #facc15; text-shadow: 3px 3px 0 #b91c1c, 0 0 14px rgba(0,0,0,.45); transform: skewX(-4deg); }
  #lbLogo span:first-child { font-size: 25px; letter-spacing: 1px; } #lbLogo span:last-child { font-size: 36px; color: #fff; text-shadow: 3px 3px 0 #1d4ed8, 0 0 14px rgba(0,0,0,.45); }
  #lbInfo { left: 12px; border-radius: 16px; clip-path: none !important; -webkit-clip-path: none !important; padding: 7px 18px 7px 12px; border-left-width: 4px; }

  /* Setelah kalah: Lobi di pojok kiri bawah, Main Lagi di pojok kanan bawah */
  #overBtns { left: 12px; right: 12px; bottom: 12px; flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 10px; }
  #overBtns .ybtn, #ovLobby, #ovAgain { height: 62px !important; justify-content: center !important; padding: 2px 14px 0 !important; gap: 8px; }
  #ovLobby { order: 1; width: 134px !important; font-size: 20px !important; }
  #ovAgain { order: 2; width: 188px !important; font-size: 22px !important; }

  /* Tombol nitro manual (di atas tombol kanan) */
  #btnN { position: absolute; right: 12px; bottom: 86px; z-index: 2; width: 66px; height: 66px; border-radius: 50%; padding: 0; isolation: isolate;
    border: 2px solid rgba(255,255,255,.6); color: #fff; font-family: var(--ui); font-style: italic; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; cursor: pointer;
    background: conic-gradient(#fbbf24 calc(var(--p, 1) * 360deg), rgba(15,23,42,.8) 0);
    box-shadow: 0 4px 12px rgba(0,0,0,.5); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #btnN::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; z-index: -1; background: radial-gradient(circle at 35% 30%, #fdba74, #ea580c 60%, #9a3412); }
  #btnN .ni { font-size: 24px; font-style: normal; }
  #btnN .nt { font-size: 9px; letter-spacing: .5px; }
  #btnN[data-st="ready"] { animation: nGlow 1.4s ease-in-out infinite; }
  #btnN[data-st="cool"]::before { background: radial-gradient(circle at 35% 30%, #475569, #1e293b); }
  #btnN[data-st="cool"] .nt { font-size: 17px; }
  #btnN[data-st="cool"] .ni { font-size: 13px; opacity: .7; }
  #btnN[data-st="active"]::before { background: radial-gradient(circle at 50% 40%, #fef08a, #f59e0b 55%, #dc2626); }
  #btnN:active { transform: scale(.94); }
  @keyframes nGlow { 50% { box-shadow: 0 0 0 4px rgba(251,191,36,.35), 0 0 18px rgba(251,146,60,.9); } }

  /* Tombol pojok kanan atas */
  .topbtn { position: absolute; top: 8px; z-index: 5; width: 40px; height: 40px;
    border-radius: 10px; border: 2px solid #94a3b8; background: rgba(15,23,42,.85); color: #fff;
    font-size: 20px; cursor: pointer; }
  .topbtn:active { transform: scale(.92); }
  #gear { right: 8px; font-size: 22px; }
  #shopBtn { right: 54px; }

  /* Notifikasi */
  #toast { --tc: #facc15; --tg: #facc1555; position: absolute; top: 56px; left: 50%; z-index: 6; width: max-content; max-width: 92%;
    display: flex; align-items: center; gap: 11px; padding: 10px 14px 13px 10px; border-radius: 16px; overflow: hidden;
    background: linear-gradient(135deg, rgba(15,23,42,.97), rgba(30,41,59,.95)); color: #fff; border: 1px solid var(--tg);
    box-shadow: 0 10px 28px rgba(0,0,0,.6), 0 0 22px var(--tg); opacity: 0; pointer-events: none;
    transform: translate(-50%, -28px) scale(.94); transition: opacity .3s, transform .45s cubic-bezier(.2,1.3,.4,1); }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #toast::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; transform: skewX(-20deg);
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.18), transparent); }
  #toast.show::after { animation: tshine 1s .25s ease-out forwards; }
  .t-ico { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 60%), var(--tc); box-shadow: 0 0 14px var(--tg); }
  .t-title { font-size: .68rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; color: var(--tc); }
  .t-text { font-size: .82rem; font-weight: 600; line-height: 1.3; margin-top: 2px; }
  .t-badge { flex: none; padding: 4px 9px; border-radius: 999px; background: rgba(250,204,21,.16); border: 1px solid #facc15;
    color: #fde047; font-weight: 800; font-size: .8rem; }
  .t-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--tc); transform-origin: left; }
  #toast.show .t-bar { animation: tbar 2.6s linear forwards; }
  @keyframes tbar { to { transform: scaleX(0); } }
  @keyframes tshine { to { left: 130%; } }

  /* Overlay mulai / game over */
  #overlay { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 10px;
    background: rgba(0,0,0,.65); padding: 20px; cursor: pointer; }
  #overlay h1, #overlay p { font-family: var(--ui); font-style: italic; }
  #overlay h1 { margin: 0; font-size: 2rem; color: #facc15; text-shadow: 3px 3px 0 #b91c1c; }
  #overlay p { margin: 0; font-size: .95rem; color: #e2e8f0; line-height: 1.5; }
  #overlay .blink { animation: blink 1s steps(2) infinite; color: #4ade80; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Kontrol layar sentuh */
  #controls { position: absolute; bottom: 10px; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; }
  #controls button { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; color: #fff; font-size: 24px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.6); box-shadow: 0 4px 10px rgba(0,0,0,.45), inset 0 -4px 0 rgba(0,0,0,.25);
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.4), rgba(255,255,255,.07) 62%), rgba(15,23,42,.5); }
  #controls button:active { transform: scale(.92); background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.55), rgba(255,255,255,.2) 62%), rgba(15,23,42,.5); }

  /* Panel (pengaturan & toko) */
  .modal { position: absolute; inset: 0; z-index: 10; display: none; align-items: center;
    justify-content: center; background: rgba(0,0,0,.75); padding: 14px; }
  .modal.open { display: flex; }
  .panel { width: 100%; max-height: 100%; overflow: auto; background: #1e293b; border: 2px solid #475569;
    border-radius: 14px; padding: 16px; }
  .panel h2, #toast .t-title { font-family: var(--ui); font-style: italic; }
  .panel h2 { margin: 0 0 12px; font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; }
  .panel h3 { margin: 14px 0 8px; font-size: .8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  .close { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices button { padding: 8px 11px; border-radius: 8px; border: 2px solid #475569; background: #0f172a;
    color: #fff; font-family: inherit; font-size: .82rem; cursor: pointer; display: flex; align-items: center; gap: 7px; text-align: left; }
  .choices button small { color: #fbbf24; }
  .choices button.active { border-color: #4ade80; background: #14532d; }
  .choices button.locked { opacity: .55; border-style: dashed; }
  .sw { display: inline-block; flex: none; width: 18px; height: 18px; border-radius: 4px; border: 1px solid #fff; }
  .sw.f1 { background: linear-gradient(90deg, #e10600 50%, #fff 50%); }
  .sw.gtr { background: linear-gradient(90deg, #f1f5f9 40%, #1d4ed8 40% 60%, #f1f5f9 60%); }
  .choices button.sel { outline: 2px solid #38bdf8; outline-offset: 1px; }

  /* Akun */
  #auth { z-index: 20; background: rgba(2,6,23,.94); }
  .field { display: block; width: 100%; padding: 11px; margin: 7px 0; border-radius: 8px; border: 2px solid #475569;
    background: #0f172a; color: #fff; font-family: inherit; font-size: 16px; }
  .field:focus { outline: none; border-color: #38bdf8; }
  .err { color: #f87171; font-size: .8rem; min-height: 1.3em; margin: 2px 0 4px; }
  .who { font-size: .85rem; color: #e2e8f0; margin-bottom: 8px; }
  .who b { color: #facc15; }
  .done:disabled { opacity: .6; }
  textarea.field { resize: none; font-size: 12px; line-height: 1.35; word-break: break-all; }

  /* Lucky Royale */
  .hr { display: flex; align-items: center; gap: 6px; }
  .folder { padding: 5px 8px; border-radius: 8px; border: 2px solid #f59e0b; background: #0f172a; color: #fde047;
    font-family: inherit; font-size: .72rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .file { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: #0f172a;
    border: 2px solid #475569; border-radius: 10px; padding: 12px; color: #fff; font-family: inherit; cursor: pointer; margin-bottom: 8px; }
  .file.lock { opacity: .55; border-style: dashed; }
  .file b { display: block; font-size: .9rem; }
  .file small { color: #94a3b8; font-size: .75rem; line-height: 1.35; display: block; margin-top: 2px; }
  .file .fi { font-size: 1.7rem; }
  .grand { display: flex; gap: 12px; align-items: center; border: 2px solid #f59e0b; border-radius: 10px; padding: 10px; margin: 8px 0;
    background: linear-gradient(135deg, #3b2a06, #0f172a); font-size: .85rem; }
  .grand .gico { font-size: 2.2rem; }
  .grand small { color: #cbd5e1; }
  .fbar { height: 8px; border-radius: 4px; background: #334155; margin: 6px 0; overflow: hidden; }
  .fbar span { display: block; height: 100%; background: #38bdf8; }
  .spinrow { display: flex; gap: 8px; margin-top: 10px; }
  .spinrow .done { margin-top: 0; line-height: 1.3; }
  .spinrow .done small { font-weight: 400; }
  .wheelbox { position: relative; width: 260px; margin: 14px auto 6px; }
  .wheelbox canvas { position: static; inset: auto; width: 260px; height: 260px; display: block; border-radius: 50%;
    image-rendering: auto; box-shadow: 0 0 18px rgba(251,191,36,.45); }
  .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
    border-left: 13px solid transparent; border-right: 13px solid transparent; border-top: 26px solid #ef4444;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .reel { font-size: 2.6rem; text-align: center; background: #0f172a; border: 2px solid #f59e0b; border-radius: 12px; padding: 14px; margin-top: 8px; }
  .res { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .res span, .odds span { background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 6px 8px; font-size: .85rem; }
  .odds { display: flex; flex-wrap: wrap; gap: 6px; }
  .odds small { color: #94a3b8; }
  .resum { margin-top: 8px; color: #fde047; font-weight: 700; font-size: .9rem; }
  .resgrand { margin-top: 8px; padding: 10px; border-radius: 10px; background: #14532d; border: 2px solid #4ade80; font-weight: 700; font-size: .85rem; }
  .ed { display: flex; gap: 10px; margin-top: 8px; }
  .ed canvas { position: static; inset: auto; flex: none; width: 200px; height: 352px; border: 2px solid #475569; border-radius: 6px;
    touch-action: none; background: #0f172a; }
  .tools { display: flex; flex-direction: column; gap: 6px; }
  .tools button { width: 44px; height: 38px; border-radius: 8px; border: 2px solid #475569; background: #0f172a; color: #fff; font-size: 1.1rem; cursor: pointer; padding: 0; }
  .tools button.sel { border-color: #38bdf8; background: #0c4a6e; }
  .tools input[type=color] { width: 44px; height: 38px; padding: 0; border: 2px solid #475569; border-radius: 8px; background: #0f172a; cursor: pointer; }
  .pal { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .pal button { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #475569; padding: 0; cursor: pointer; }
  .pal button.sel { border-color: #fff; outline: 2px solid #38bdf8; }
  .sizerow { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: .8rem; color: #94a3b8; }
  .sizerow input[type=range] { flex: 1; accent-color: #38bdf8; }
  .sizerow b { min-width: 28px; text-align: right; color: #fff; }
  .gtopic { margin-bottom: 8px; }
  .gbody { background: #0f172a; border: 1px solid #475569; border-radius: 10px; padding: 12px; font-size: .84rem; line-height: 1.5; }
  .gbody ul { margin: 6px 0 0; padding-left: 18px; } .gbody li { margin-bottom: 6px; }
  .gbody p { margin: 0 0 8px; }
  .sw.canvas { background: linear-gradient(135deg, #ef4444, #facc15, #22c55e, #38bdf8, #8b5cf6); }

  /* Upgrade mobil */
  .upg { background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 9px; margin-bottom: 8px; font-size: .82rem; }
  .upg .uhead { display: flex; justify-content: space-between; gap: 8px; }
  .upg .pips { color: #4ade80; letter-spacing: 2px; }
  .upg .ufx { color: #94a3b8; margin: 4px 0 2px; line-height: 1.4; }

  /* Pratinjau skin di toko */
  .preview { display: flex; gap: 12px; align-items: center; background: #0f172a; border: 1px solid #475569;
    border-radius: 10px; padding: 10px; margin: 6px 0 10px; }
  .preview canvas { position: static; inset: auto; flex: none; width: 112px; height: 120px;
    border-radius: 8px; border: 1px solid #334155; image-rendering: auto; }
  .pinfo { flex: 1; min-width: 0; }
  .pname { font-weight: 700; font-size: .95rem; }
  .pstat { color: #fbbf24; font-size: .82rem; margin: 3px 0; }
  .pdesc { color: #94a3b8; font-size: .75rem; line-height: 1.4; min-height: 1em; }
  .pbtn { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 8px; background: #22c55e;
    color: #052e16; font-weight: 700; font-family: inherit; font-size: .85rem; cursor: pointer; }
  .pbtn.dis { background: #475569; color: #cbd5e1; }
  .pbtn.alt { background: #f59e0b; color: #1f2937; }
  .sw.lambo { background: linear-gradient(90deg, #f3f4f6 60%, #111827 60%); }
  .sw.taxi { background: repeating-linear-gradient(90deg, #facc15 0 4px, #111 4px 8px); }

  // ====== DATA TERSIMPAN ======
  // Semua data disimpan di browser/perangkat ini (localStorage).
  const GS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const LS = { get(k) { return GS.get(k); }, set(k, v) { GS.set(k, v); } };
  const parse = (k, d) => { try { return JSON.parse(LS.get(k) || 'null') || d; } catch (e) { return d; } };
  const DATA_KEYS = ['settings', 'unlocks', 'owned', 'hi', 'hard-best', 'coins', 'missions', 'upgrades', 'biomes', 'trails'];

  const settings = { skinId: 'red', mode: 'normal', biome: 'meadow', view: 'top', lang: GS.get('racer-lang') || 'id' };
  if (!I18N[settings.lang]) settings.lang = 'id';
  const unlocks = { f1: false, gtr: false, canvas: false };
  const owned = {};
  const trailsOwned = {};
  const biomesOpen = { meadow: true };
  let hiScore = 0, hardBest = 0, coins = 0, missions = null, frags = 0;

  const isOwned = s => s.lock ? !!unlocks[s.lock] : (s.price === 0 || !!owned[s.id]);

  function resetMemory() {   // kosongkan data di memori (bahasa tetap)
    Object.assign(settings, { skinId: 'red', mode: 'normal', biome: 'meadow', view: 'top', trail: 'none', music: true, musicVol: 0.6 });
    for (const k of Object.keys(trailsOwned)) delete trailsOwned[k];
    Object.assign(unlocks, { f1: false, gtr: false, canvas: false });
    for (const k of Object.keys(owned)) delete owned[k];
    for (const k of Object.keys(biomesOpen)) delete biomesOpen[k];
    biomesOpen.meadow = true;
    hiScore = 0; hardBest = 0; coins = 0; missions = null; frags = 0;
    for (const k of Object.keys(upg)) upg[k] = 0;
  }

  function loadProfile() {   // muat data tersimpan
    const keepLang = settings.lang;
    resetMemory();
    const saved = parse('racer-settings', {});
    Object.assign(settings, saved);
    if (typeof saved.skin === 'number' && !saved.skinId) {   // format lama: skin disimpan sebagai nomor urut
      settings.skinId = ['red', 'blue', 'yellow', 'green', 'purple', 'white', 'f1', 'gtr'][saved.skin] || 'red';
    }
    delete settings.skin;
    if (!saved.lang) settings.lang = keepLang;
    if (!I18N[settings.lang]) settings.lang = 'id';
    if (!MODES[settings.mode]) settings.mode = 'normal';
    if (settings.view !== 'fp') settings.view = 'top';
    if (typeof settings.music !== 'boolean') settings.music = true;
    settings.musicVol = Math.max(0, Math.min(1, +settings.musicVol >= 0 ? +settings.musicVol : 0.6));
    if (!BIOMES[settings.biome]) settings.biome = 'meadow';
    Object.assign(unlocks, parse('racer-unlocks', {}));
    Object.assign(owned, parse('racer-owned', {}));
    Object.assign(trailsOwned, parse('racer-trails', {}));
    if (!TRAILS.some(t => t.id === settings.trail) || !isTrailOwned(settings.trail)) settings.trail = 'none';
    previewTrail = settings.trail;
    Object.assign(biomesOpen, parse('racer-biomes', {}));
    biomesOpen.meadow = true;
    { // pembelian peta dihapus (peta kini dicapai lewat terowongan): koin yang pernah dipakai membelinya dikembalikan sekali
      var mapRefund = Object.keys(biomesOpen).filter(k => k !== 'meadow' && BIOMES[k]).reduce((a, k) => a + BIOMES[k].price, 0);
      if (Object.keys(biomesOpen).length > 1) { for (const k of Object.keys(biomesOpen)) delete biomesOpen[k]; biomesOpen.meadow = true; LS.set('racer-biomes', JSON.stringify(biomesOpen)); }
    }
    settings.biome = 'meadow';
    // pemain lama yang sudah memakai skin berbayar tetap boleh memakainya
    { const cur = skinById(settings.skinId); if (cur && cur.price > 0 && !cur.lock && !owned[cur.id] && typeof saved.skin === 'number') owned[cur.id] = true; }
    // skin lama: Emas -> Polisi (harga sama, kepemilikan ikut pindah); Balap Oranye dihapus (koinnya dikembalikan)
    if (owned.gold) { owned.police = true; delete owned.gold; saveOwned(); }
    if (settings.skinId === 'gold') settings.skinId = 'police';
    if (!skinById(settings.skinId) || !isOwned(skinById(settings.skinId))) settings.skinId = 'red';
    hiScore = +LS.get('racer-hi') || 0;
    hardBest = +LS.get('racer-hard-best') || 0;
    coins = +LS.get('racer-coins') || 0;
    if (mapRefund > 0) { coins += mapRefund; saveCoins(); }
    if (owned.stripe) { coins += 120; delete owned.stripe; saveCoins(); saveOwned(); }
    delete unlocks.mbg;
    frags = Math.max(0, Math.floor(+LS.get('racer-frags') || 0));
    loadCanvas();
    missions = parse('racer-missions', null);
    loadUpgrades();
    previewId = settings.skinId;
    GS.set('racer-lang', settings.lang);
  }

  function drawEnemy(e) {

  // gambar bodi mobil sesuai skin (dipakai di permainan dan di pratinjau toko)
  function drawSkinBody(s, x, y) {
    ctx.save();
    if (s.glow) { ctx.shadowColor = s.glow; ctx.shadowBlur = 16; }
    if (s.kind === 'f1') drawF1(x, y);
    else if (s.kind === 'gtr') drawGTR(x, y);
    else if (s.kind === 'lambo') drawLambo(x, y);
    else if (s.kind === 'canvas') drawCanvasCar(x, y);
    else drawCar(x, y, s.color, false, EXTRA[s.kind]);
    ctx.restore();
  }

  // pratinjau skin di toko: mobil bergoyang pelan di atas jalan mini
  let previewId = settings.skinId;
  function drawPreview() {
    const s = skinById(previewId); if (!s) return;
    const main = ctx; ctx = pctx;
    try {
      const w = pcv.width, h = pcv.height;
      ctx.fillStyle = '#2f7d32'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#374151'; ctx.fillRect(w / 2 - 66, 0, 132, h);
      ctx.fillStyle = '#fff'; ctx.fillRect(w / 2 - 68, 0, 3, h); ctx.fillRect(w / 2 + 65, 0, 3, h);
      ctx.fillStyle = '#e5e7eb';
      for (let y = -40 + (tick * 2) % 60; y < h; y += 60) { ctx.fillRect(w / 2 - 42, y, 3, 32); ctx.fillRect(w / 2 + 39, y, 3, 32); }
      ctx.save();
      ctx.translate(w / 2, h / 2); ctx.scale(1.3, 1.3); ctx.translate(-CAR_W / 2, -CAR_H / 2);
      tiltOverride = 0.08 * Math.sin(tick / 40);
      ctx.restore();
      // jejak (pratinjau): partikel di belakang mobil
      emitTrail(pparts, previewTrail, w / 2, h / 2 + CAR_H * 0.65 + 2, 3);
      for (const q of pparts) { q.x += q.vx; q.y += q.vy; q.life -= 1; }
      for (let i = pparts.length - 1; i >= 0; i--) if (pparts[i].life <= 0) pparts.splice(i, 1);
      for (const q of pparts) { const sz = (q.s || 3) * 1.2; ctx.globalAlpha = Math.min(1, q.life / 20); ctx.fillStyle = q.color; ctx.fillRect(q.x - sz / 2, q.y - sz / 2, sz, sz); }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(w / 2, h / 2); ctx.scale(1.3, 1.3); ctx.translate(-CAR_W / 2, -CAR_H / 2);
      drawSkinBody(s, 0, 0);
      ctx.restore();
    } finally { tiltOverride = null; ctx = main; }
  }

  function drawPlayer() {
    const s = skinById(settings.skinId), x = player.x, y = PLAYER_Y;
    // api nitro
    if (player.nitro > 0) {
      ctx.save();
      ctx.translate(x + CAR_W / 2, y + CAR_H - 2); ctx.rotate(tilt(y));
      ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.lineTo(0, 26 + Math.random() * 20); ctx.fill();
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(0, 14 + Math.random() * 10); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    if (player.invuln > 0 && ((tick >> 2) & 1)) ctx.globalAlpha = 0.4;
    drawSkinBody(s, x, y);
    ctx.restore();
    // perisai
    if (player.shield) {
      const cx = x + CAR_W / 2, cy = y + CAR_H / 2, p = 1 + 0.05 * Math.sin(tick / 6);
      ctx.save();
      ctx.fillStyle = 'rgba(125,211,252,.18)'; ctx.strokeStyle = 'rgba(125,211,252,.9)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cx, cy, 40 * p, 62 * p, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  function drawPickup(p) {
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    if (p.type === 'coin') {
      const sq = Math.abs(Math.cos((tick + p.seed) / 10));
      ctx.save();
      const one = (x, y) => {
        ctx.shadowColor = '#fde047'; ctx.shadowBlur = 8;
        ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.ellipse(x, y, 11 * sq + 1.5, 12, 0, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.ellipse(x, y, 7 * sq + 1, 8, 0, 0, 7); ctx.fill();
      };
      if (player && player.x2 > 0) { one(cx - 7, cy + 2); one(cx + 7, cy - 2); }   // boost aktif: dua koin berdempetan
      else one(cx, cy);
      ctx.restore();
    } else if (p.type === 'puddle' || p.type === 'pothole') {
      drawHazard(p, cx, cy);
    } else if (p.type === 'tunnel') {
      drawPortal(p, cx, cy);
    } else if (p.type === 'engine') {
      const pulse = 1 + 0.12 * Math.sin(tick / 8);
      ctx.save();
      ctx.fillStyle = 'rgba(250,204,21,.22)'; ctx.beginPath(); ctx.arc(cx, cy, 34 * pulse, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(250,204,21,.35)'; ctx.beginPath(); ctx.arc(cx, cy, 24 * pulse, 0, 7); ctx.fill();
      ctx.shadowColor = '#facc15'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#4b5563'; ctx.fillRect(p.x + 4, p.y + 14, 36, 20);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#9ca3af'; ctx.fillRect(p.x + 4, p.y + 14, 36, 4);
      ctx.fillStyle = '#6b7280';
      for (let i = 0; i < 4; i++) ctx.fillRect(p.x + 6 + i * 9, p.y + 4, 7, 11);
      ctx.fillStyle = '#f97316'; ctx.fillRect(p.x + 40, p.y + 20, 5, 8); ctx.fillRect(p.x - 1, p.y + 20, 5, 8);
      ctx.fillStyle = '#facc15'; ctx.fillRect(p.x + 18, p.y + 22, 8, 6);
      ctx.restore();
    } else {
      const col = { shield: '#38bdf8', nitro: '#f97316', magnet: '#ef4444', x2: '#f59e0b' }[p.type];
      const icon = { shield: '🛡', nitro: '⚡', magnet: '🧲', x2: '' }[p.type];
      const pulse = 1 + 0.08 * Math.sin(tick / 7);
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 14;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, 18 * pulse, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = p.type === 'x2' ? '#fde047' : 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(cx, cy, 14 * pulse, 0, 7); ctx.fill();
      ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (p.type === 'x2') { ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#92400e'; ctx.fillText('x2', cx, cy + 1); }   // koin berlogo x2
      else { ctx.fillStyle = '#000'; ctx.fillText(icon, cx, cy + 1); }
      ctx.restore();
    }
  }

  function drawRoad() {
    const B = biome(), STEP = 4;
    for (let y = 0; y < H; y += STEP) {
      const z = dist + (H - y);
      const c = roadCenter(y + STEP / 2), L = Math.round(c - ROAD_W / 2), R = L + ROAD_W;
      ctx.fillStyle = B.ground[Math.floor(z / 70) % 2]; ctx.fillRect(0, y, W, STEP);
      if (B.kind === 'beach') {                                                   // laut di sisi kiri
        const seaR = L - 28;
        if (seaR > 0) {
          ctx.fillStyle = (Math.floor(z / 46) % 2) ? '#2a9ad6' : '#3aa8e2'; ctx.fillRect(0, y, seaR, STEP);
          ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(seaR - 5, y, 5, STEP);   // buih ombak
        }
      }
      ctx.fillStyle = B.road; ctx.fillRect(L, y, ROAD_W, STEP);                    // aspal
      ctx.fillStyle = B.curb[Math.floor(z / 40) % 2];                              // tepi jalan
      ctx.fillRect(L - 6, y, 6, STEP); ctx.fillRect(R, y, 6, STEP);
      if (z % 60 < 34) {                                                            // marka jalan putus-putus
        ctx.fillStyle = B.dash;
        for (let i = 1; i < LANES; i++) ctx.fillRect(L + i * LANE_W - 2, y, 4, STEP);
      }
    }
    drawScenery();
  }

  // ====== PEMANDANGAN TEPI JALAN ======
  function hrand(a, b, c) {   // angka acak tetap untuk posisi tertentu (tidak berkedip saat digulung)
    let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function drawProp(kind, r1, r3) {
    if (kind === 'meadow') {
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(3, 9, 15, 7, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#6b4423'; ctx.fillRect(-3, -2, 6, 14);
      ctx.fillStyle = r1 < 0.6 ? '#1f6a2a' : '#2a7d34'; ctx.beginPath(); ctx.arc(0, -8, 15, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(-4, -12, 7, 0, 7); ctx.fill();
    } else if (kind === 'beach') {
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(4, 12, 14, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-2, -4, 4, 18);
      ctx.fillStyle = '#16a34a';
      for (let a = 0; a < 6; a++) {
        const ang = a * 1.047 + r1 * 3;
        ctx.beginPath(); ctx.ellipse(Math.cos(ang) * 10, -6 + Math.sin(ang) * 10, 11, 3.5, ang, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.arc(0, -5, 3, 0, 7); ctx.fill();
    } else if (kind === 'desert') {
      if (r3 < 0.55) {          // kaktus
        ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(4, 14, 14, 5, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#3f8f3a';
        ctx.fillRect(-4, -18, 8, 32);
        ctx.fillRect(-13, -8, 9, 5); ctx.fillRect(-13, -16, 5, 10);
        ctx.fillRect(4, -4, 9, 5); ctx.fillRect(8, -12, 5, 10);
        ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(-2, -16, 2, 28);
      } else {                  // batu
        ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(3, 8, 16, 7, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#a3785a'; ctx.beginPath(); ctx.ellipse(0, 2, 15, 10, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#c0956f'; ctx.beginPath(); ctx.ellipse(-4, -1, 8, 5, 0, 0, 7); ctx.fill();
      }
    } else if (kind === 'snow') {
      ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(4, 12, 15, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#5b3a1e'; ctx.fillRect(-2.5, 4, 5, 9);
      for (let i = 0; i < 3; i++) {
        const hw = 17 - i * 4, ty = -24 + i * 10;
        ctx.fillStyle = '#1e5a3a'; ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(-hw, ty + 16); ctx.lineTo(hw, ty + 16); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(-hw * 0.62, ty + 10); ctx.lineTo(hw * 0.62, ty + 10); ctx.closePath(); ctx.fill();
      }
    }
  }

  function drawBuilding(edge, y, side, r1, r2, r3) {   // gedung tampak atas
    const w = 38 + r3 * 34, h = 56 + r2 * 46;
    const x0 = side > 0 ? edge + 4 : edge - 4 - w;
    const pal = ['#8b95a5', '#7c7f8a', '#9a8f86', '#6f8191'];
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x0 + 4, y - h / 2 + 4, w, h);
    ctx.fillStyle = pal[Math.floor(r1 * 7) % pal.length]; ctx.fillRect(x0, y - h / 2, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(x0 + 3, y - h / 2 + 3, w - 6, h - 6);
    ctx.fillStyle = 'rgba(30,41,59,.4)'; ctx.fillRect(x0 + 8, y - h / 2 + 9, 11, 8);
    ctx.fillStyle = 'rgba(30,41,59,.25)'; ctx.fillRect(x0, y - h / 2, w, 3);
  }

  function drawScenery() {
    const B = biome(), GAP = 84, seed = Math.floor(phase1 * 100);
    const k0 = Math.floor((dist - 90) / GAP), k1 = Math.ceil((dist + H + 90) / GAP);
    for (const side of [-1, 1]) {
      if (B.kind === 'beach' && side < 0) continue;      // sisi kiri pantai adalah laut
      for (let k = k0; k <= k1; k++) {
        const r1 = hrand(k, side, seed), r2 = hrand(k, side * 7, seed + 1), r3 = hrand(k, side * 13, seed + 2);
        if (r1 < 0.25) continue;                          // sebagian slot dikosongkan
        const y = H - (k * GAP + r2 * GAP * 0.8 - dist);
        if (y < -80 || y > H + 80) continue;
        const edge = roadCenter(y) + side * (ROAD_W / 2 + 12);
        ctx.save();
        if (B.kind === 'city') drawBuilding(edge, y, side, r1, r2, r3);
        else {
          ctx.translate(edge + side * (16 + r3 * 26), y);
          const sc = 0.8 + r3 * 0.55; ctx.scale(sc, sc);
          drawProp(B.kind, r1, r3);
        }
        ctx.restore();
      }
    }
  }

  // ====== CUACA ======
  const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
  const mctx = mask.getContext('2d');
  const wAlpha = type => (wCur === type ? wFade : 0) + (wPrev === type && wPrev !== wCur ? 1 - wFade : 0);

  function glow(x, y, r, a) {
    const g = mctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    mctx.fillStyle = g; mctx.beginPath(); mctx.arc(x, y, r, 0, 7); mctx.fill();
  }
  function drawNight(a) {
    mctx.globalCompositeOperation = 'source-over';
    mctx.clearRect(0, 0, W, H);
    mctx.fillStyle = `rgba(4,8,28,${0.8 * a})`; mctx.fillRect(0, 0, W, H);
    mctx.globalCompositeOperation = 'destination-out';
    const px = player.x + CAR_W / 2;
    mctx.save(); mctx.translate(px, PLAYER_Y + 14); mctx.rotate(tilt(PLAYER_Y));
    const g = mctx.createLinearGradient(0, 0, 0, -330);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0.12)');
    mctx.fillStyle = g; mctx.beginPath();
    mctx.moveTo(-20, 0); mctx.lineTo(20, 0); mctx.lineTo(95, -330); mctx.lineTo(-95, -330); mctx.closePath(); mctx.fill();
    mctx.restore();
    glow(px, PLAYER_Y + CAR_H / 2, 70, 0.7);
    for (const e of enemies) glow(e.x + e.w / 2, e.y + e.h, 46, 0.85);
    for (const p of pickups) glow(p.x + p.w / 2, p.y + p.h / 2, 36, 0.8);
    mctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(mask, 0, 0);
  }
  function drawWeather() {
    const B = biome(), aRain = wAlpha('rain'), aNight = wAlpha('night'), aFog = wAlpha('fog');
    if (aRain > 0.01) {
      if (B.precip === 'snow') {         // salju turun
        ctx.fillStyle = `rgba(226,232,240,${0.16 * aRain})`; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = `rgba(255,255,255,${0.95 * aRain})`;
        for (const d of drops) ctx.fillRect(d.x + Math.sin((tick + d.y) / 22) * 4, d.y, 2.6, 2.6);
      } else {                           // hujan
        ctx.fillStyle = `rgba(15,23,42,${0.28 * aRain})`; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = `rgba(190,215,255,${0.55 * aRain})`; ctx.lineWidth = 1.2; ctx.beginPath();
        for (const d of drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 3, d.y + d.l); }
        ctx.stroke();
      }
    }
    if (aFog > 0.01) {                   // kabut (di gurun: badai pasir)
      const g = ctx.createLinearGradient(0, 0, 0, H * 0.75);
      g.addColorStop(0, `rgba(${B.fogRGB},${0.92 * aFog})`); g.addColorStop(1, `rgba(${B.fogRGB},0)`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = `rgba(${B.fogRGB},${0.12 * aFog})`; ctx.fillRect(0, 0, W, H);
    }
    if (aNight > 0.01) { if (isFP()) drawNightFP(aNight); else drawNight(aNight); }
  }

  const wKey = type => {
    const B = biome();
    if (type === 'rain' && B.precip === 'snow') return 'wSnow';
    if (type === 'fog' && B.fogName === 'sand') return 'wSand';
    return { clear: 'wClear', rain: 'wRain', night: 'wNight', fog: 'wFog' }[type];
  };
  const wIconOf = type => {
    const B = biome();
    if (type === 'rain') return B.precip === 'snow' ? '❄' : '🌧';
    if (type === 'fog') return B.fogName === 'sand' ? '🌪' : '🌫';
    return { clear: '☀', night: '🌙' }[type] || '☀';
  };
  function changeWeather() {
    const opts = Object.entries(biome().w).filter(([k, v]) => v > 0 && k !== wCur);
    let r = Math.random() * opts.reduce((a, o) => a + o[1], 0), pick = opts[0][0];
    for (const o of opts) { if ((r -= o[1]) <= 0) { pick = o[0]; break; } }
    wPrev = wCur; wCur = pick; wFade = 0;
    nextWeatherAt = dist + 2500 + Math.random() * 2000;
  }

  function drawHUD() {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, 196, 66);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace';

    ctx.font = '18px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(wIcon, 166, 44);
    // status efek aktif
    let ex = 8; const ey = 72;
    const chip = (icon, frac) => {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(ex, ey, 62, 20);
      ctx.font = '14px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(icon, ex + 3, ey + 2);
      ctx.fillStyle = '#334155'; ctx.fillRect(ex + 24, ey + 7, 34, 6);
      ctx.fillStyle = '#4ade80'; ctx.fillRect(ex + 24, ey + 7, 34 * Math.max(0, Math.min(1, frac)), 6);
      ex += 66;
    };
    if (player && player.shield) chip('🛡', player.shield / (player.shieldMax || 1));
    if (player && player.nitro > 0) chip('⚡', player.nitro / (player.nitroMax || NITRO_TIME));
    if (player && player.magnet > 0) chip('🧲', player.magnet / (player.magnetMax || MAGNET_TIME));
    if (player && player.x2 > 0) chip('x2', player.x2 / (player.x2Max || X2_TIME));
    ctx.restore();
  }

  // ====== LOGIKA ======
  function pickEnemyType() {
    const base = ENEMY_WEIGHTS[settings.mode], em = biome().em;
    const w = Object.entries(base).map(([k, v]) => [k, v * (em[k] || 1)]);
    let r = Math.random() * w.reduce((a, o) => a + o[1], 0);
    for (const [k, v] of w) { if ((r -= v) <= 0) return k; }
    return 'car';
  }
  function freeLane() {
    const busy = new Set(enemies.filter(e => e.y < 300).map(e => e.lane));
    const free = [0, 1, 2].filter(l => !busy.has(l));
    return free.length ? free[Math.floor(Math.random() * free.length)] : -1;
  }

  function spawn() {
    const m = MODES[settings.mode];
    let lane = Math.floor(Math.random() * LANES);
    if (lane === lastLane && Math.random() < 0.6) lane = (lane + 1 + Math.floor(Math.random() * 2)) % LANES;
    if (ev && ev.type === 'bridge' && lane === ev.lane) lane = [0, 1, 2].filter(l => l !== ev.lane)[Math.floor(Math.random() * 2)];

    // Mesin langka untuk skin GTR (hanya selama belum terbuka)
    if (!unlocks.gtr && Math.random() < ENGINE_CHANCE && !enemies.some(e => e.lane === lane && e.y < 250)) {
      pickups.push({ type: 'engine', off: (lane - 1) * LANE_W, x: 0, y: -ENG_H - 10 - LEAD(), w: ENG_W, h: ENG_H });
      lastLane = lane;
      spawnTimer = m.gap * 0.9 * (4.5 / speed);
      return;
    }

    // pastikan selalu ada jalur kosong di dekat bagian atas
    const near = new Set(enemies.filter(e => e.y < 220).map(e => e.lane));
    near.add(lane);
    if (near.size >= LANES) { spawnTimer = 12; return; }

    const type = pickEnemyType(), d = ENEMY_TYPES[type];
    const color = type === 'moto' ? MOTO_COLORS[Math.floor(Math.random() * MOTO_COLORS.length)]
                : type === 'truck' ? ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)]
                : ENEMY_COLORS[Math.floor(Math.random() * ENEMY_COLORS.length)];
    enemies.push({ type, lane, off: (lane - 1) * LANE_W, w: d.w, h: d.h, m: d.m, x: 0, y: -d.h - 10 - LEAD(), v: d.v(), color });
    lastLane = lane;
    spawnTimer = m.gap * (0.7 + Math.random() * 0.6) * (4.5 / speed) * biome().gap + (type === 'truck' ? 25 : 0);
  }

  function spawnCoins() {
    coinTimer = (150 + Math.random() * 130) * (4.5 / speed);
    const lane = freeLane(); if (lane < 0) { coinTimer = 30; return; }
    const n = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) pickups.push({ type: 'coin', off: (lane - 1) * LANE_W, x: 0, y: -30 - i * 52 - LEAD(), w: 26, h: 26, seed: Math.random() * 20 });
  }
  function spawnItem() {
    itemTimer = 650 + Math.random() * 550;
    const lane = freeLane(); if (lane < 0) { itemTimer = 60; return; }
    const r = Math.random(), type = r < 0.38 ? 'shield' : r < 0.69 ? 'magnet' : 'x2';   // nitro kini tombol manual, bukan item
    pickups.push({ type, off: (lane - 1) * LANE_W, x: 0, y: -50 - LEAD(), w: 38, h: 38 });
  }

  function hitRect(a, b, m) {
    const am = 6;
    return a.x + am < b.x + b.w - m && a.x + a.w - am > b.x + m &&
           a.y + am < b.y + b.h - m && a.y + a.h - am > b.y + m;
  }
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function smash(e, nitro) {
    e.dead = true; burst(e.x + e.w / 2, e.y + e.h / 2, '#f97316', 14); sfx.smash();
    if (e.type !== 'barrier') { score += nitro ? 2 : 1; scoreChanged(); }
  }

  function collect(p) {
    p.taken = true;
    const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
    if (p.type === 'coin') {
      const dbl = player.x2 > 0;   // item Koin Boost: koin bernilai 2x selama beberapa detik
      coins += dbl ? 2 : 1; saveCoins(); sfx.coin(); burst(cx, cy, dbl ? '#ffffff' : '#fde047', dbl ? 9 : 5); addProgress('coin', 1);
    }
    else if (p.type === 'engine') { sfx.engine(); unlock('gtr'); }
    else {
      burst(cx, cy, '#ffffff', 10); addProgress('item', 1);
      if (p.type === 'shield') { player.shield = player.shieldMax = 1 + upg.shield; sfx.item(); }
      else if (p.type === 'nitro') { player.nitro = player.nitroMax = nitroTime(); sfx.nitro(); addProgress('nitro', 1); }
      else if (p.type === 'magnet') { player.magnet = player.magnetMax = magnetTime(); sfx.item(); }
      else if (p.type === 'x2') { player.x2 = player.x2Max = X2_TIME; sfx.item(); }
    }
  }

  function update(dt) {
    const m = MODES[settings.mode];
    speed = Math.min(m.max, speed + m.accel * dt);
    const nitro = player.nitro > 0;
    const sp = speed * (nitro ? 1.55 : 1);
    dist += sp * dt;
    if (warp) updateWarp(dt); else { updateEvent(); maybeSpawnTunnel(); }
    if (player.nitro > 0) player.nitro -= dt;
    if (player.nitroCd > 0 && player.nitro <= 0) player.nitroCd -= dt;   // cooldown 60 detik penuh dihitung setelah nitro selesai
    if (player.magnet > 0) player.magnet -= dt;
    if (player.x2 > 0) player.x2 -= dt;
    if (player.invuln > 0) player.invuln -= dt;

    // cuaca
    if (!warp && dist >= nextWeatherAt) changeWeather();
    wFade = Math.min(1, wFade + 0.006 * dt);
    const snowy = biome().precip === 'snow';
    for (const d of drops) { d.y += d.s * dt * (snowy ? 0.28 : 1); d.x -= (snowy ? 0.5 : 2) * dt; if (d.y > H) { d.y = -20; d.x = Math.random() * (W + 40); } if (d.x < -10) d.x = W; }

    // gerak pemain (hujan = licin)
    let slip = 0.3 + 0.03 * upg.handling - 0.14 * wAlpha('rain') - biome().slip;
    if (player.skid > 0) { slip *= 0.2; player.skid -= dt; player.off += Math.sin(tick / 3) * 2.4 * dt; }   // genangan: kemudi licin
    const steerTo = (warp && warp.phase === 'in') ? warp.p.off : (player.lane - 1) * LANE_W;
    player.off += (steerTo - player.off) * Math.min(1, (warp && warp.phase === 'in' ? 0.14 : slip) * dt);
    player.x = carX(PLAYER_Y, player.off);

    if (settings.trail && settings.trail !== 'none') emitTrail(parts, settings.trail, player.x + CAR_W / 2, PLAYER_Y + CAR_H + 2, sp);
    if (!warp) {
      spawnTimer -= dt; if (spawnTimer <= 0) spawn();
      coinTimer -= dt; if (coinTimer <= 0) spawnCoins();
      itemTimer -= dt; if (itemTimer <= 0) spawnItem();
    }

    const pr = { x: player.x, y: PLAYER_Y, w: CAR_W, h: CAR_H };

    for (const e of enemies) {
      e.y += (sp + e.v + 1.5) * dt;
      e.x = entityX(e.y, e.w, e.h, e.off);
      if (!e.dead && !warp && hitRect(pr, e, e.m)) {
        if (nitro) smash(e, true);
        else if (player.invuln > 0) { /* kebal sesaat */ }
        else if (player.shield) { player.shield--; player.invuln = 50; smash(e, false); sfx.shield(); addProgress('shield', 1); }
        else return crash();
      }
    }

    for (const p of pickups) {
      p.y += sp * dt;
      if (p.type === 'coin' && player.magnet > 0 && Math.abs(p.y + p.h / 2 - (PLAYER_Y + CAR_H / 2)) < magnetRange()) {
        p.off += (player.off - p.off) * 0.2 * dt;
        p.y += ((PLAYER_Y + CAR_H / 2) - (p.y + p.h / 2)) * 0.12 * dt;
      }
      p.x = roadCenter(p.y + p.h / 2) + p.off - p.w / 2;
      if (!p.taken && overlap(pr, p)) { if (p.type === 'puddle' || p.type === 'pothole') hazardHit(p); else if (p.type === 'tunnel') { if (!warp) enterTunnel(p); } else collect(p); }
    }
    pickups = pickups.filter(p => !p.taken && p.y < H + 20);

    let passed = 0;
    enemies = enemies.filter(e => {
      if (e.dead) return false;
      if (e.y >= H + 10) { if (e.type !== 'barrier') passed++; return false; }
      return true;
    });
    if (passed > 0) {
      score += passed * (nitro ? 2 : 1); sfx.pass();
      addProgress('pass', passed); scoreChanged();
    }
  }

  function crash() {
    state = 'over'; shake = 14; sfx.crash();
    fpCrash = { t: tick, x: 150 + Math.random() * 60, cr: Array.from({ length: 12 }, (_, i) => ({ a: i / 12 * 6.283 + Math.random() * 0.4, l: 24 + Math.random() * 44, w: 0.15 + Math.random() * 0.4 })) };
    burst(player.x + CAR_W / 2, PLAYER_Y + CAR_H / 2, '#f97316', 26);
    if (score > hiScore) { hiScore = score; LS.set('racer-hi', hiScore); }
    if (settings.mode === 'hard' && score > hardBest) { hardBest = score; LS.set('racer-hard-best', hardBest); }
    saveCoins();
    setOverlay({ kind: 'over', score, hi: hiScore });
    $('game').classList.add('over');   // tampilkan pilihan: main lagi / lobi
  }

  // ====== OVERLAY ======

  function renderOverlay() {

  // ====== LOBI: jalan diagonal yang bergerak, mobil jalan santai, peta berganti tiap 10 detik dengan transisi mulus ======
  const LOBBY_MAPS = ['meadow', 'city', 'beach', 'desert', 'snow'];
  const LOBBY_ANGLE = 0.62, LOBBY_RW = 190, LOBBY_HOLD = 600, LOBBY_FADE = 100;   // 600 frame = 10 detik
  const lobby = { s: 0, idx: 0, next: -1, timer: 0, fade: 0 };
  const lobbyOff = document.createElement('canvas'); lobbyOff.width = W; lobbyOff.height = H;
  const lobbyOffCtx = lobbyOff.getContext('2d');
  function lobbyScene(B) {   // gambar jalan diagonal untuk satu peta (memakai ctx yang sedang aktif)
    const RW = LOBBY_RW, s = lobby.s, R = 460;
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.rotate(LOBBY_ANGLE);
    const band = (len, from, to, x, w, colors, horiz) => {};
    let base = Math.floor(s / 70), frac = s - base * 70;
    for (let i = -8; i <= 8; i++) { ctx.fillStyle = B.ground[(((base - i) % 2) + 2) % 2]; ctx.fillRect(-R, (i - 1) * 70 + frac, 2 * R, 70); }
    if (B.kind === 'beach') {
      base = Math.floor(s / 46); frac = s - base * 46;
      for (let i = -12; i <= 12; i++) { ctx.fillStyle = (((base - i) % 2) + 2) % 2 ? '#2a9ad6' : '#3aa8e2'; ctx.fillRect(-R, (i - 1) * 46 + frac, R - RW / 2 - 34 + 0, 46); }
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(-RW / 2 - 39, -R, 5, 2 * R);
    }
    ctx.fillStyle = B.road; ctx.fillRect(-RW / 2, -R, RW, 2 * R);
    base = Math.floor(s / 40); frac = s - base * 40;
    for (let i = -13; i <= 13; i++) { ctx.fillStyle = B.curb[(((base - i) % 2) + 2) % 2]; const y = (i - 1) * 40 + frac; ctx.fillRect(-RW / 2 - 6, y, 6, 40); ctx.fillRect(RW / 2, y, 6, 40); }
    base = Math.floor(s / 60); frac = s - base * 60; ctx.fillStyle = B.dash;
    for (let i = -9; i <= 9; i++) { const y = i * 60 + frac - 34; ctx.fillRect(-RW / 6 - 2, y, 4, 34); ctx.fillRect(RW / 6 - 2, y, 4, 34); }
    const GAP = 84, k0 = Math.floor((s - R - 80) / GAP) - 1, k1 = Math.ceil((s + R + 80) / GAP);
    for (const side of [-1, 1]) {
      if (B.kind === 'beach' && side < 0) continue;
      for (let k = k0; k <= k1; k++) {
        const r1 = hrand(k, side, 77), r2 = hrand(k, side * 7, 78), r3 = hrand(k, side * 13, 79);
        if (r1 < 0.25) continue;
        const y = s - (k * GAP + r2 * GAP * 0.8); if (y < -R - 60 || y > R + 60) continue;
        const edge = side * (RW / 2 + 12);
        ctx.save();
        if (B.kind === 'city') drawBuilding(edge, y, side, r1, r2, r3);
        else { ctx.translate(edge + side * (16 + r3 * 26), y); const sc = 0.8 + r3 * 0.55; ctx.scale(sc, sc); drawProp(B.kind, r1, r3); }
        ctx.restore();
      }
    }
    ctx.restore();
  }
  function drawLobby(dt) {
    lobby.s += 2.4 * dt; lobby.timer += dt;
    if (lobby.next < 0 && lobby.timer >= LOBBY_HOLD) { lobby.next = (lobby.idx + 1) % LOBBY_MAPS.length; lobby.fade = 0; }
    if (lobby.next >= 0) {
      lobby.fade += dt / LOBBY_FADE;
      if (lobby.fade >= 1) { lobby.idx = lobby.next; lobby.next = -1; lobby.timer = 0; lobby.fade = 0; }
    }
    lobbyScene(BIOMES[LOBBY_MAPS[lobby.idx]]);
    if (lobby.next >= 0) {   // transisi mulus: peta berikutnya memudar masuk di atas peta sekarang
      const main = ctx; ctx = lobbyOffCtx; lobbyScene(BIOMES[LOBBY_MAPS[lobby.next]]); ctx = main;
      ctx.globalAlpha = lobby.fade * lobby.fade * (3 - 2 * lobby.fade); ctx.drawImage(lobbyOff, 0, 0); ctx.globalAlpha = 1;
    }
    // mobil berjalan santai di tengah jalan
    const sway = Math.sin(lobby.s / 90) * 5, sk = skinById(settings.skinId), to = tiltOverride;
    if (settings.trail && settings.trail !== 'none') emitTrail(parts, settings.trail, sway, CAR_H / 2 + 2, 4);
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(LOBBY_ANGLE);
    for (const p of parts) { const sz = p.s || 3; ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.color; ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(sway + 4, 6, CAR_W / 2 + 6, CAR_H / 2 + 4, 0, 0, 7); ctx.fill();
    ctx.rotate(Math.cos(lobby.s / 90) * 0.035); tiltOverride = 0;
    drawSkinBody(sk, sway - CAR_W / 2, -CAR_H / 2);
    tiltOverride = to; ctx.restore();
  }
  function updateLobbyInfo() {
    $('lbBest').textContent = '🏆 ' + T('hudRecord') + ' ' + hiScore;
    $('lbCoins').textContent = '🪙 ' + coins;
  }
  function enterLobby() {
    clearTimeout(overTimer); state = 'lobby'; parts = [];
    $('overlay').style.display = 'none'; $('game').classList.remove('over'); $('game').classList.add('lobby');
    updateLobbyInfo(); applyMusic();
  }
  $('lbSettings').addEventListener('click', () => openPanel('settings'));
  $('lbShop').addEventListener('click', () => openPanel('shop'));
  function updateViewBtn() { $('lbViewT').textContent = T('lbView'); $('lbViewV').textContent = T(settings.view === 'fp' ? 'viewFp' : 'viewTop'); }
  $('lbView').addEventListener('click', () => { if (panelOpen()) return; settings.view = settings.view === 'fp' ? 'top' : 'fp'; saveSettings(); updateViewBtn(); sfx.click(); });
  $('lbPlay').addEventListener('click', () => { if (!panelOpen()) start(); });

  function start() {
    audio(); ensureMissions(); clearTimeout(overTimer); reset(); state = 'playing'; sfx.start();
    $('overlay').style.display = 'none'; $('game').classList.remove('lobby', 'over'); applyMusic();
  }
  // ---- nitro manual (cooldown 1 menit) ----
  const NITRO_CD = 3600;   // 60 detik x 60 frame
  function useNitro() {
    if (state !== 'playing' || !player || warp) return;
    if (player.nitro > 0 || player.nitroCd > 0) { sfx.deny(); return; }
    player.nitro = player.nitroMax = nitroTime(); player.nitroCd = NITRO_CD; sfx.nitro(); addProgress('nitro', 1);
  }
  let nbSt = '', nbTxt = '', nbP = '';
  function updateNitroBtn() {
    const b = $('btnN'); if (!player) return;
    const act = player.nitro > 0, cd = player.nitroCd, st = act ? 'active' : cd > 0 ? 'cool' : 'ready';
    const p = act ? Math.max(0, player.nitro / (player.nitroMax || NITRO_TIME)) : cd > 0 ? 1 - cd / NITRO_CD : 1;
    const txt = cd > 0 && !act ? String(Math.ceil(cd / 60)) : 'NITRO', ps = p.toFixed(2);
    if (st !== nbSt) { nbSt = st; b.dataset.st = st; }
    if (txt !== nbTxt) { nbTxt = txt; b.querySelector('.nt').textContent = txt; }
    if (ps !== nbP) { nbP = ps; b.style.setProperty('--p', ps); }
  }
  $('btnN').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); useNitro(); });
  function move(dir) {
    if (state !== 'playing' || warp) return;
    const n = Math.max(0, Math.min(LANES - 1, player.lane + dir));
    if (n !== player.lane) { player.lane = n; sfx.move(); }
  }

  // ====== LOOP ======
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.667); last = now; tick++;
    if (state === 'playing') { update(dt); updateNitroBtn(); }
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter(p => p.life > 0);

    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake *= 0.9; if (shake < .5) shake = 0; }

    else {
      drawRoad();
      drawEventUnder();

      if (player && state !== 'over') drawPlayer();
      if (warp && warp.phase === 'in') drawPortal(warp.p, warp.p.x + warp.p.w / 2, warp.p.y + warp.p.h / 2);   // gundukan menutupi mobil: mobil masuk ke terowongan
      for (const p of parts) { const sz = p.s || 3; ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.color; ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (state !== 'lobby' && !(warp && warp.phase === 'inside')) { drawWeather(); drawEventOver(); }

  // ====== LUCKY ROYALE (event spin + Studio Canvas) ======

  // ---- skin Canvas: mobil lengkap (ban, kaca, lampu) dengan cat putih polos yang dilukis bebas pakai kuas ----
  const PW = 100, PH = 176, PS = 2;   // ruang gambar 100x176; kanvas lukis beresolusi 2x (halus, bukan piksel)
  const BODY = new Path2D('M26 6 L74 6 Q90 8 91 30 L91 146 Q90 168 74 170 L26 170 Q10 168 9 146 L9 30 Q10 8 26 6 Z');
  const ED_PAL = ['#000000', '#ffffff', '#9ca3af', '#4b5563', '#ef4444', '#f97316', '#facc15', '#22c55e',
                  '#14b8a6', '#38bdf8', '#2563eb', '#8b5cf6', '#ec4899', '#92400e', '#fde68a', '#7dd3fc'];
  let paintCv = null, canvasSprite = null;
  function rr(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
  function newPaint() {   // lapisan cat: putih polos di dalam bodi mobil (goresan tidak bisa keluar dari bodi)
    const c = document.createElement('canvas'); c.width = PW * PS; c.height = PH * PS;
    const x = c.getContext('2d'); x.setTransform(PS, 0, 0, PS, 0, 0); x.clip(BODY);
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, PW, PH);
    return c;
  }
  function carUnder(x) {   // roda (di bawah cat)
    for (const [wx, wy] of [[2, 22], [88, 22], [2, 120], [88, 120]]) {
      x.fillStyle = '#111827'; rr(x, wx, wy, 10, 34, 4); x.fill();
      x.fillStyle = '#4b5563'; rr(x, wx + 3, wy + 6, 4, 22, 2); x.fill();
    }
  }
  function carOver(x) {    // kaca, lampu, spion, garis bodi (di atas cat)
    x.lineWidth = 1.6; x.strokeStyle = 'rgba(15,23,42,.6)'; x.stroke(BODY);
    x.lineWidth = 1; x.strokeStyle = 'rgba(15,23,42,.25)';
    x.beginPath(); x.moveTo(14, 48); x.quadraticCurveTo(50, 54, 86, 48); x.moveTo(14, 142); x.quadraticCurveTo(50, 136, 86, 142); x.stroke();
    x.fillStyle = '#1f2937'; rr(x, 2, 62, 9, 8, 3); x.fill(); rr(x, 89, 62, 9, 8, 3); x.fill();            // spion
    const g = x.createLinearGradient(0, 52, 0, 80); g.addColorStop(0, '#dff4ff'); g.addColorStop(1, '#7dc3e8');
    x.fillStyle = g; x.strokeStyle = 'rgba(15,23,42,.65)'; x.lineWidth = 1.2;
    x.beginPath(); x.moveTo(23, 52); x.lineTo(77, 52); x.lineTo(85, 80); x.lineTo(15, 80); x.closePath(); x.fill(); x.stroke();   // kaca depan
    x.fillStyle = '#5ba6d1'; x.beginPath(); x.moveTo(17, 122); x.lineTo(83, 122); x.lineTo(77, 140); x.lineTo(23, 140); x.closePath(); x.fill(); x.stroke();   // kaca belakang
    x.fillStyle = '#9fd4f0'; rr(x, 11, 84, 6, 34, 2); x.fill(); x.stroke(); rr(x, 83, 84, 6, 34, 2); x.fill(); x.stroke();      // kaca samping
    x.fillStyle = '#fff59d'; rr(x, 14, 8, 21, 9, 4); x.fill(); x.stroke(); rr(x, 65, 8, 21, 9, 4); x.fill(); x.stroke();        // lampu depan
    x.fillStyle = '#111827'; rr(x, 40, 9, 20, 6, 2); x.fill();                                                                   // gril
    x.fillStyle = '#ef4444'; rr(x, 13, 159, 23, 8, 3); x.fill(); x.stroke(); rr(x, 64, 159, 23, 8, 3); x.fill(); x.stroke();     // lampu belakang
    x.fillStyle = '#e5e7eb'; rr(x, 40, 160, 20, 7, 1.5); x.fill(); x.stroke();                                                  // plat nomor
  }
  function buildSprite() {
    const c = document.createElement('canvas'); c.width = PW; c.height = PH;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
    carUnder(x); x.drawImage(paintCv, 0, 0, PW, PH); carOver(x);
    canvasSprite = c;
  }
  function loadCanvas() {
    paintCv = newPaint(); buildSprite();
    const raw = LS.get('racer-canvas2');
    if (typeof raw === 'string' && raw.indexOf('data:image/png') === 0) {
      const img = new Image();
      img.onload = () => { const x = paintCv.getContext('2d'); x.clearRect(0, 0, PW, PH); x.drawImage(img, 0, 0, PW, PH); buildSprite(); };
      img.src = raw;
      return;
    }
    const old = LS.get('racer-canvas');   // desain piksel lama (sekali saja): dipindah ke lapisan cat
    if (old) try {
      const o = JSON.parse(old), x = paintCv.getContext('2d'); let any = false;
      if (o && Array.isArray(o.p) && typeof o.d === 'string' && o.d.length === 25 * 44) {
        for (let i = 0; i < o.d.length; i++) {
          if (o.d[i] === '.') continue;
          const col = o.p[parseInt(o.d[i], 36)];
          if (typeof col !== 'string' || !/^#[0-9a-f]{6}$/i.test(col) || col.toLowerCase() === '#ffffff') continue;
          x.fillStyle = col; x.fillRect((i % 25) * 4, Math.floor(i / 25) * 4, 4, 4); any = true;
        }
        if (any) { LS.set('racer-canvas2', paintCv.toDataURL('image/png')); buildSprite(); }
      }

  }
  function drawCanvasCar(x, y) {
    if (!canvasSprite) return;

    ctx.translate(x + CAR_W / 2, y + CAR_H / 2);

  // ---- hadiah spin ----
  function pickPrize() {
    let r = Math.random() * SPIN_TOTAL;
    for (const p of SPIN_PRIZES) { r -= p.w; if (r < 0) return p; }
    return SPIN_PRIZES[0];
  }
  // ---- roda hadiah bulat (spiral) yang berputar ----
  const SPIN_MS = 3600;   // lama roda berputar
  let wheelRot = 0, tickTimer = null;
  const WHEEL_COLORS = ['#b45309', '#d97706', '#a16207', '#c2410c', '#1d4ed8', '#0e7490', '#4338ca', '#9333ea'];   // urut sama dengan SPIN_PRIZES
  const prizeRank = p => p.t === 'grand' ? 1e6 : p.v;

  function drawPrizeIcon(x, p) {   // gambar hadiah, titik tengah (0,0)
    x.textAlign = 'center'; x.textBaseline = 'middle';
    if (p.t === 'coin') {
      x.fillStyle = '#f59e0b'; x.beginPath(); x.arc(0, 0, 33, 0, 7); x.fill();
      x.fillStyle = '#fde047'; x.beginPath(); x.arc(0, 0, 26, 0, 7); x.fill();
      x.fillStyle = '#92400e'; x.font = (p.v >= 100 ? 'bold 24px' : 'bold 28px') + ' sans-serif'; x.fillText(String(p.v), 0, 2);
    } else if (p.t === 'frag') {
      x.fillStyle = '#38bdf8'; x.strokeStyle = '#0c4a6e'; x.lineWidth = 3;
      x.beginPath(); x.rect(-17, -24, 34, 34); x.fill(); x.stroke();
      x.beginPath(); x.arc(0, -24, 8, 0, 7); x.fill(); x.stroke();
      x.beginPath(); x.arc(17, -7, 8, 0, 7); x.fill(); x.stroke();
      x.fillRect(-15, -22, 30, 30);
      x.font = 'bold 26px sans-serif'; x.lineWidth = 5; x.strokeStyle = '#0c4a6e'; x.fillStyle = '#fff';
      x.strokeText(String(p.v), 0, 26); x.fillText(String(p.v), 0, 26);
    } else {   // hadiah utama: mobil putih kecil + kilau
      x.fillStyle = '#111'; x.fillRect(-20, -22, 7, 14); x.fillRect(13, -22, 7, 14); x.fillRect(-20, 8, 7, 14); x.fillRect(13, 8, 7, 14);
      x.fillStyle = '#ffffff'; x.strokeStyle = '#94a3b8'; x.lineWidth = 2; x.beginPath(); x.rect(-14, -32, 28, 64); x.fill(); x.stroke();
      x.fillStyle = '#38bdf8'; x.fillRect(-10, -16, 20, 12); x.fillRect(-10, 8, 20, 9);
      x.fillStyle = '#facc15'; x.font = 'bold 26px sans-serif'; x.fillText('✦', 26, -30); x.fillText('✦', -26, 30);
    }
  }
  function drawWheel(c) {
    const S = 520, R = 244, cx = S / 2, cy = S / 2, n = SPIN_PRIZES.length, seg = Math.PI * 2 / n;
    c.width = S; c.height = S;
    const x = c.getContext('2d');
    x.fillStyle = '#fbbf24'; x.beginPath(); x.arc(cx, cy, R + 14, 0, 7); x.fill();           // pinggiran emas
    x.fillStyle = '#fff'; for (let i = 0; i < 24; i++) { const a = i * Math.PI * 2 / 24; x.beginPath(); x.arc(cx + Math.cos(a) * (R + 7), cy + Math.sin(a) * (R + 7), 3.5, 0, 7); x.fill(); }
    for (let i = 0; i < n; i++) {                                                             // juring hadiah
      const a0 = -Math.PI / 2 + i * seg;
      x.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
      x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, R, a0, a0 + seg); x.closePath(); x.fill();
    }
    x.save(); x.beginPath(); x.arc(cx, cy, R, 0, 7); x.clip();                               // pola spiral
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = 7; x.lineCap = 'round';
    for (let arm = 0; arm < 3; arm++) {
      x.beginPath();
      for (let t = 0; t <= Math.PI * 5; t += 0.05) {
        const r = R * 1.02 * t / (Math.PI * 5), a = t + arm * Math.PI * 2 / 3;
        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
        if (t === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.stroke();
    }
    x.restore();
    x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 3;                                 // garis pemisah
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i * seg; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); x.stroke(); }
    for (let i = 0; i < n; i++) {                                                             // gambar hadiah
      const a = -Math.PI / 2 + (i + 0.5) * seg;
      x.save(); x.translate(cx + Math.cos(a) * R * 0.66, cy + Math.sin(a) * R * 0.66); x.rotate(a + Math.PI / 2);
      drawPrizeIcon(x, SPIN_PRIZES[i]); x.restore();
    }
    const g = x.createRadialGradient(cx - 8, cy - 8, 4, cx, cy, 40);                         // poros tengah
    g.addColorStop(0, '#fef3c7'); g.addColorStop(1, '#d97706');
    x.fillStyle = g; x.beginPath(); x.arc(cx, cy, 38, 0, 7); x.fill();
    x.strokeStyle = '#fff'; x.lineWidth = 4; x.stroke();
    x.fillStyle = '#7c2d12'; x.font = 'bold 34px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('★', cx, cy + 2);
  }

  function doSpin(n) {
    if (spinBusy) return;
    const cost = SPIN_COST[n];
    if (coins < cost) { sfx.deny(); luckyMsg = T('noCoins').replace('{p}', cost); renderLucky(); return; }
    coins -= cost;
    const res = []; let gCoins = 0, gFrags = 0, grand = false, dup = false;
    for (let i = 0; i < n; i++) {
      const p = pickPrize(); res.push(p);
      if (p.t === 'coin') gCoins += p.v;
      else if (p.t === 'frag') { if (unlocks.canvas) gCoins += p.v; else gFrags += p.v; }   // skin sudah dimiliki: fragmen jadi koin 1:1
      else if (unlocks.canvas || grand) { gCoins += GRAND_DUP_COINS; dup = true; }
      else grand = true;
    }
    coins += gCoins; frags += gFrags; saveCoins(); saveFrags();
    spinRes = { n, res, gCoins, gFrags, grand, dup };
    luckyMsg = ''; spinBusy = true; sfx.click();
    renderLucky();   // roda diam di posisi terakhir, tombol nonaktif; lalu diputar
    // roda berhenti di hadiah terbaik dari putaran ini
    const best = res.reduce((a, p) => prizeRank(p) > prizeRank(a) ? p : a, res[0]);
    const seg = 360 / SPIN_PRIZES.length, center = SPIN_PRIZES.indexOf(best) * seg + seg / 2;
    const want = (((360 - center + (Math.random() - 0.5) * seg * 0.6) % 360) + 360) % 360, cur = ((wheelRot % 360) + 360) % 360;
    wheelRot += 360 * 5 + (((want - cur) % 360) + 360) % 360;
    const w = $('wheel');
    if (w) { void w.offsetWidth; w.style.transition = `transform ${SPIN_MS}ms cubic-bezier(.12,.62,.08,1)`; w.style.transform = `rotate(${wheelRot}deg)`; }
    clearInterval(tickTimer);
    tickTimer = setInterval(() => tone(600 + Math.random() * 300, 0.03, 'square', 0.03), 110);
    clearTimeout(reelTimer);
    reelTimer = setTimeout(() => {
      clearInterval(tickTimer); spinBusy = false;
      if (grand) unlock('canvas'); else if (gCoins + gFrags > 0) sfx.coin();
      if (openName === 'lucky' && luckyView === 'spin') renderLucky();
    }, SPIN_MS + 150);
  }
  function openDecorate() { openPanel('lucky'); luckyView = 'studio'; renderLucky(); }
  function doExchange() {
    if (unlocks.canvas || frags < FRAG_GOAL) { sfx.deny(); return; }
    frags -= FRAG_GOAL; saveFrags(); unlock('canvas'); luckyMsg = T('exchanged'); renderLucky();
  }

  function renderSpin(body) {
    const own = !!unlocks.canvas, fp = Math.min(100, Math.round(100 * frags / FRAG_GOAL));
    const odds = SPIN_PRIZES.map(p => `<span>${prizeText(p)} <small>${pct1(100 * p.w / SPIN_TOTAL)}%</small></span>`).join('');
    let out = '';
    if (!spinBusy && spinRes) {
      const r = spinRes, chips = r.res.map(p => `<span>${prizeText(p)}</span>`).join('');
      out = `<div class="res">${chips}</div><div class="resum">${T('total')}: 🪙 +${r.gCoins} &nbsp; 🧩 +${r.gFrags}</div>` +
            (r.n > 1 ? `<div class="note">${T('wheelBest')}</div>` : '') +
            (r.grand ? `<div class="resgrand">${T('grandGot')}</div>` : '') +
            (r.dup ? `<div class="note">${T('dupGot').replace('{c}', GRAND_DUP_COINS)}</div>` : '');
    }
    body.innerHTML =
      `<div class="coinbar">🪙 ${coins} &nbsp; 🧩 ${frags}${own ? '' : '/' + FRAG_GOAL}</div>` +
      `<div class="wheelbox"><canvas id="wheel"></canvas><div class="pointer"></div></div>` +
      `<div class="spinrow"><button class="done" id="sp1" ${spinBusy ? 'disabled' : ''}>${T('spin1')}<br><small>🪙 ${SPIN_COST[1]}</small></button>` +
      `<button class="done" id="sp10" ${spinBusy ? 'disabled' : ''}>${T('spin10')}<br><small>🪙 ${SPIN_COST[10]}</small></button></div>` +
      `<div class="hint">${luckyMsg}</div><div id="spinOut">${out}</div>` +
      `<div class="grand"><div class="gico">🎨</div><div><b>${T('grand')}</b><br><small>${T('grandD').replace('{p}', pct1(100 * SPIN_PRIZES[SPIN_PRIZES.length - 1].w / SPIN_TOTAL))}</small></div></div>` +
      (own ? `<div class="note">${T('ownedCanvas')}</div>`
           : `<div class="fbar"><span style="width:${fp}%"></span></div>` +
             `<button class="pbtn ${frags >= FRAG_GOAL ? '' : 'dis'}" id="exBtn">${T('exchange').replace('{n}', Math.min(frags, FRAG_GOAL)).replace('{g}', FRAG_GOAL)}</button>`) +
      `<h3>${T('odds')}</h3><div class="odds">${odds}</div>`;
    const w = $('wheel'); drawWheel(w); w.style.transform = `rotate(${wheelRot}deg)`;
    $('sp1').onclick = () => doSpin(1); $('sp10').onclick = () => doSpin(10);
    if ($('exBtn')) $('exBtn').onclick = doExchange;
  }

  // ---- Studio Canvas: melukis cat mobil dengan kuas bebas (tanpa simetris, tanpa piksel) ----
  let ed = null;
  function renderStudio(body) {
    const work = newPaint(); work.getContext('2d').drawImage(paintCv, 0, 0, PW, PH);
    ed = { cv: work, x: work.getContext('2d'), color: '#ef4444', size: 8, tool: 'brush', undo: [], painting: false, last: null, mid: null };
    body.innerHTML =
      `<div class="coinbar" id="edCoins">🪙 ${coins}</div>` +
      `<div class="note">${T('studioHint').replace('{c}', DECOR_COST)}</div>` +
      `<div class="ed"><canvas id="edCv" width="${PW * PS}" height="${PH * PS}"></canvas><div class="tools" id="edTools"></div></div>` +
      `<div class="sizerow"><span>${T('brushSize')}</span><input type="range" id="edSize" min="2" max="36" value="${ed.size}"><b id="edSizeV">${ed.size}</b></div>` +
      `<div class="pal" id="edPal"></div>` +
      `<button class="done" id="edSave">${T('studioSave').replace('{c}', DECOR_COST)}</button><div class="hint" id="edMsg"></div>`;
    const view = $('edCv'), vx = view.getContext('2d'), x = ed.x;
    const draw = () => {
      vx.setTransform(1, 0, 0, 1, 0, 0); vx.fillStyle = '#243247'; vx.fillRect(0, 0, view.width, view.height);
      vx.setTransform(PS, 0, 0, PS, 0, 0); carUnder(vx); vx.drawImage(ed.cv, 0, 0, PW, PH); carOver(vx);
    };
    const pushUndo = () => { ed.undo.push(x.getImageData(0, 0, ed.cv.width, ed.cv.height)); if (ed.undo.length > 20) ed.undo.shift(); };
    const style = () => { const c = ed.tool === 'eraser' ? '#ffffff' : ed.color; x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = ed.size; x.strokeStyle = c; x.fillStyle = c; };
    const tools = () => {
      const t = $('edTools'); t.innerHTML = '';
      const add = (icon, title, on, fn) => { const b = document.createElement('button'); b.textContent = icon; b.title = title; b.setAttribute('aria-label', title); if (on) b.className = 'sel'; b.onclick = () => { sfx.click(); fn(); }; t.appendChild(b); };
      add('🖌️', T('toolBrush'), ed.tool === 'brush', () => { ed.tool = 'brush'; tools(); pal(); });
      add('🧽', T('toolErase'), ed.tool === 'eraser', () => { ed.tool = 'eraser'; tools(); pal(); });
      add('🪣', T('toolFillAll'), false, () => { pushUndo(); x.fillStyle = ed.color; x.fillRect(0, 0, PW, PH); draw(); });
      add('↩', T('toolUndo'), false, () => { const u = ed.undo.pop(); if (u) { x.putImageData(u, 0, 0); draw(); } });
      add('🗑', T('toolClear'), false, () => { pushUndo(); x.fillStyle = '#ffffff'; x.fillRect(0, 0, PW, PH); draw(); });
      const ci = document.createElement('input'); ci.type = 'color'; ci.title = T('toolColor'); ci.value = ed.color;
      ci.oninput = () => { ed.color = ci.value; if (ed.tool === 'eraser') { ed.tool = 'brush'; tools(); } pal(); };
      t.appendChild(ci);
    };
    const pal = () => {
      const p = $('edPal'); p.innerHTML = '';
      ED_PAL.forEach(c => {
        const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-label', c);
        if (c === ed.color && ed.tool !== 'eraser') b.className = 'sel';
        b.onclick = () => { sfx.click(); ed.color = c; if (ed.tool === 'eraser') ed.tool = 'brush'; tools(); pal(); };
        p.appendChild(b);
      });
    };
    const pt = e => { const r = view.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * PW, y: (e.clientY - r.top) / r.height * PH }; };
    view.addEventListener('pointerdown', e => {
      e.preventDefault(); view.setPointerCapture(e.pointerId); pushUndo();
      const q = pt(e); ed.painting = true; ed.last = q; ed.mid = q; style();
      x.beginPath(); x.arc(q.x, q.y, ed.size / 2, 0, 7); x.fill(); draw();
    });
    view.addEventListener('pointermove', e => {
      if (!ed.painting) return;
      const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
      for (const ce of (evs.length ? evs : [e])) {
        const q = pt(ce), m = { x: (ed.last.x + q.x) / 2, y: (ed.last.y + q.y) / 2 };
        x.beginPath(); x.moveTo(ed.mid.x, ed.mid.y); x.quadraticCurveTo(ed.last.x, ed.last.y, m.x, m.y); x.stroke();   // goresan dihaluskan
        ed.mid = m; ed.last = q;
      }
      draw();
    });
    const stop = () => { ed.painting = false; };
    view.addEventListener('pointerup', stop); view.addEventListener('pointercancel', stop);
    $('edSize').oninput = e => { ed.size = +e.target.value; $('edSizeV').textContent = ed.size; };
    $('edSave').onclick = () => {
      if (coins < DECOR_COST) { sfx.deny(); $('edMsg').textContent = T('studioNeed').replace('{c}', DECOR_COST); return; }
      coins -= DECOR_COST; saveCoins(); $('edCoins').textContent = '🪙 ' + coins;
      const nv = newPaint(); nv.getContext('2d').drawImage(ed.cv, 0, 0, PW, PH); paintCv = nv;
      LS.set('racer-canvas2', paintCv.toDataURL('image/png')); buildSprite();
      previewId = 'canvas'; sfx.buy();
      $('edMsg').textContent = T('studioSaved');
    };
    tools(); pal(); draw();
  }

  const EVENTS = [   // w = bobot peluang, len = panjang kejadian (satuan jarak)

    { id: 'pothole', w: 18, len: 1700 }, { id: 'bridge', w: 16, len: 1900 },

  function startEvent() {
    const pool = EVENTS.filter(e => !(e.id === 'tunnel' && wCur === 'night'));
    let r = Math.random() * pool.reduce((a, e) => a + e.w, 0), pick = pool[0];
    for (const e of pool) { if ((r -= e.w) <= 0) { pick = e; break; } }
    ev = { type: pick.id, from: dist, to: dist + pick.len, a: 0, nextSpawn: dist + 250, nextBar: dist, lane: Math.random() < 0.5 ? 0 : 2 };
  }
  function hazard(kind) {

  }
  function updateEvent() {
    if (!ev) { if (dist >= nextEventAt) startEvent(); return; }

    if (dist >= ev.to) { ev = null; nextEventAt = dist + 3000 + Math.random() * 3000; return; }
    if (ev.type === 'puddle' && dist >= ev.nextSpawn) { ev.nextSpawn += 330 + Math.random() * 150; hazard('puddle'); }

  function sidePoly(side, off) {

  function drawEventUnder() {   // dinding terowongan / air di bawah jembatan (digambar setelah jalan)

  function drawEventOver() {    // gelap terowongan + lampu dinding (digambar setelah cuaca)
